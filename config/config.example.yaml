# config.example.yaml - Example configuration for encrypted-db
# Copy this file to config.yaml and fill in your values
# Or set environment variables for sensitive values

server:
  ip: "127.0.0.1"
  port: "8080"

postgres:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "${POSTGRES_PASSWORD}"
  dbname: "postgres"
  ttl: 30
  sslmode: "disable"

redis:
  host: "localhost"
  port: "6379"
  password: "${REDIS_PASSWORD}"
  db: 0

rabbitmq:
  username: "${RABBITMQ_USER}"
  password: "${RABBITMQ_PASSWORD}"
  host: "localhost"
  port: "5672"
  exchanges:
    currency: "currency_exchange"
    user: "user_exchange"
    notifications: "notification_exchange"

jwt:
  ssl:
    admin:
      private_key: []
      public_key: []
    user:
      private_key: []
      public_key: []
  issuer: "encrypted-db"
  access_token:
    expiration: 15
  refresh_token:
    expiration: 10080

otp:
  auth:
    name: "AUTH"
    ttl: 60
    length: 6
    retry_limit: 3
