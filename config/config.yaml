server:
  ip: "127.0.0.1"
  port: "8080"
  read_timeout_seconds: 10
  write_timeout_seconds: 10
  idle_timeout_seconds: 120
  mode: "debug"

postgres:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: ""
  dbname: "exchange"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_minutes: 5
  conn_max_idle_time_minutes: 5

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2

rabbitmq:
  username: ""
  password: ""
  host: "localhost"
  port: "5672"
  exchanges:
    price_updates: "price_updates"
    trade_events: "trade_events"
    order_events: "order_events"
    settlement: "settlement"
    notifications: "notifications"

jwt:
  ssl:
    admin:
      private_key: []
      public_key: []
    user:
      private_key: []
      public_key: []
  issuer: "encrypted-db-exchange"
  access_token:
    expiration_minutes: 15
  refresh_token:
    expiration_minutes: 10080

otp:
  auth:
    name: "AUTH"
    ttl_seconds: 60
    length: 6
    retry_limit: 3

websocket:
  allowed_origins: []
  ping_interval_seconds: 30
  max_message_size_bytes: 1048576

exchange:
  name: "EncryptedDB Exchange"
  timezone: "UTC"
  maintenance_window:
    enabled: false
    start: "02:00"
    end: "04:00"
    timezone: "UTC"

assets:
  registry_path: "configs/assets.yaml"
  auto_sync: true

markets:
  default_maker_fee_bps: 10
  default_taker_fee_bps: 20
  enable_market_orders: true
  enable_stop_orders: true

price_aggregator:
  enabled: true
  providers:
    - name: "binance"
      enabled: true
      type: "websocket"
      ws_endpoint: "wss://stream.binance.com:9443/ws"
      rest_endpoint: "https://api.binance.com"
      api_key: ""
      api_secret: ""
      passphrase: ""
      symbols:
        - "btcusdt"
        - "ethusdt"
        - "trxusdt"
        - "usdtusd"
      rate_limit: 10
      timeout_seconds: 10
      reconnect_delay_seconds: 5
  aggregation_interval_ms: 100
  vwap_windows_seconds: [1, 5, 60, 300]
  outlier_threshold_mad: 3.0
  min_providers: 2
  stale_threshold_ms: 5000
  publish_to_redis: true
  publish_to_rabbitmq: true

custody:
  providers:
    - provider_type: "INTERNAL"
      asset_ids: ["USD", "EUR", "BTC", "ETH", "TRX", "USDT"]
      network: "internal"
      enabled: true
      rpc_endpoints: []
      confirmations_required: 0
      min_deposit_amount: "0"
      min_withdrawal_amount: "0"
      max_withdrawal_amount: "0"
      default_fee_level: "normal"
      fee_asset_id: ""
      hot_wallet_address: ""
      cold_wallet_address: ""
      block_poll_interval_seconds: 0
      reorg_depth: 0
      sanctions_screening: false

fiat:
  providers: []

compliance:
  sanctions:
    providers:
      - name: "ofac"
        enabled: true
        priority: 1
        endpoint: "https://www.treasury.gov/ofac/downloads/sdn.csv"
        timeout_seconds: 30
    screen_on_deposit: true
    screen_on_withdrawal: true
    screen_on_trade: false
    periodic_rescreen_hours: 24
  aml:
    enabled: true
    rules_path: "configs/aml_rules.yaml"
  kyc:
    providers:
      - name: "manual"
        enabled: true
        endpoint: ""
        timeout_seconds: 0
    default_tier: "STANDARD"
    auto_approve_low_risk: false

observability:
  logging:
    level: "info"
    format: "json"
    output: "stdout"
    file_path: ""
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""
    service_name: "encrypted-db-exchange"
    sample_rate: 0.1

rate_limits:
  rest:
    requests_per_second: 100
    burst: 200
  ws:
    messages_per_second: 50
    burst: 100
  trading:
    orders_per_second: 10
    burst: 20
  auth:
    login_attempts_per_minute: 5
    otp_requests_per_hour: 10