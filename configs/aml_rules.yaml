# AML Rules Configuration
# Rules for anti-money laundering monitoring
# Each rule has a type, configuration, thresholds, and action

aml_rules:
  # Velocity Rules - Transaction frequency/volume monitoring
  - id: "velocity_high_frequency"
    name: "High Frequency Trading"
    description: "Detect unusually high transaction frequency from a single account"
    rule_type: "VELOCITY"
    enabled: true
    config:
      metric: "trade_count"
      window_hours: 1
      group_by: "user_id"
    threshold_count: 100
    threshold_amount: "0"
    time_window_hours: 1
    action: "ALERT"
    severity: "MEDIUM"

  - id: "velocity_high_volume"
    name: "High Volume Trading"
    description: "Detect unusually high trading volume from a single account"
    rule_type: "VELOCITY"
    enabled: true
    config:
      metric: "quote_volume"
      window_hours: 24
      group_by: "user_id"
    threshold_count: 0
    threshold_amount: "1000000"  # $1M in 24h
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  - id: "velocity_deposit_withdrawal"
    name: "Rapid Deposit-Withdrawal Cycles"
    description: "Detect rapid deposit followed by withdrawal (potential layering)"
    rule_type: "VELOCITY"
    enabled: true
    config:
      metric: "deposit_withdrawal_ratio"
      window_hours: 24
      group_by: "user_id"
    threshold_count: 5
    threshold_amount: "0"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # Structuring Rules - Breaking large amounts into smaller ones
  - id: "structuring_withdrawal"
    name: "Withdrawal Structuring"
    description: "Multiple withdrawals just below reporting threshold"
    rule_type: "STRUCTURING"
    enabled: true
    config:
      threshold_amount: "9000"  # Just below $10k
      window_hours: 24
      min_transactions: 3
      group_by: "user_id"
    threshold_count: 3
    threshold_amount: "9000"
    time_window_hours: 24
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "structuring_deposit"
    name: "Deposit Structuring"
    description: "Multiple deposits just below reporting threshold"
    rule_type: "STRUCTURING"
    enabled: true
    config:
      threshold_amount: "9000"
      window_hours: 24
      min_transactions: 3
      group_by: "user_id"
    threshold_count: 3
    threshold_amount: "9000"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # High-Risk Country Rules
  - id: "high_risk_country_deposit"
    name: "Deposits from High-Risk Jurisdictions"
    description: "Flag deposits originating from high-risk countries"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    config:
      high_risk_countries:
        - "KP"  # North Korea
        - "IR"  # Iran
        - "SY"  # Syria
        - "CU"  # Cuba
        - "VE"  # Venezuela
        - "BY"  # Belarus
        - "MM"  # Myanmar
        - "AF"  # Afghanistan
      check_fields:
        - "user_country"
        - "counterparty_country"
        - "ip_country"
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "high_risk_country_withdrawal"
    name: "Withdrawals to High-Risk Jurisdictions"
    description: "Block withdrawals to sanctioned/high-risk countries"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    config:
      high_risk_countries:
        - "KP"
        - "IR"
        - "SY"
        - "CU"
        - "VE"
        - "BY"
        - "MM"
        - "AF"
      check_fields:
        - "destination_country"
        - "ip_country"
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  # Mixer/Tumbler Detection
  - id: "mixer_deposit"
    name: "Mixer/Tumbler Deposit Detection"
    description: "Detect deposits from known mixer/tumbler addresses"
    rule_type: "MIXER"
    enabled: true
    config:
      mixer_address_list: "chainalysis_mixer"
      check_direction: "deposit"
      require_confirmations: 3
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "REVIEW"
    severity: "HIGH"

  - id: "mixer_withdrawal"
    name: "Mixer/Tumbler Withdrawal Detection"
    description: "Detect withdrawals to known mixer/tumbler addresses"
    rule_type: "MIXER"
    enabled: true
    config:
      mixer_address_list: "chainalysis_mixer"
      check_direction: "withdrawal"
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  # Darknet Market Interaction
  - id: "darknet_deposit"
    name: "Darknet Market Deposit"
    description: "Detect deposits from known darknet market addresses"
    rule_type: "DARKNET"
    enabled: true
    config:
      darknet_address_list: "chainalysis_darknet"
      check_direction: "deposit"
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "darknet_withdrawal"
    name: "Darknet Market Withdrawal"
    description: "Detect withdrawals to known darknet market addresses"
    rule_type: "DARKNET"
    enabled: true
    config:
      darknet_address_list: "chainalysis_darknet"
      check_direction: "withdrawal"
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  # Sanctions Screening
  - id: "sanctions_user_onboarding"
    name: "User Onboarding Sanctions Check"
    description: "Screen all new users against sanctions lists"
    rule_type: "SANCTIONS"
    enabled: true
    config:
      screen_type: "USER_ONBOARDING"
      providers: ["ofac", "chainalysis", "trm"]
      block_on_match: true
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "sanctions_deposit_address"
    name: "Deposit Address Sanctions Check"
    description: "Screen deposit addresses against sanctions lists"
    rule_type: "SANCTIONS"
    enabled: true
    config:
      screen_type: "DEPOSIT_ADDRESS"
      providers: ["ofac", "chainalysis"]
      block_on_match: true
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "sanctions_withdrawal_address"
    name: "Withdrawal Address Sanctions Check"
    description: "Screen withdrawal destination addresses"
    rule_type: "SANCTIONS"
    enabled: true
    config:
      screen_type: "WITHDRAWAL_ADDRESS"
      providers: ["ofac", "chainalysis", "trm"]
      block_on_match: true
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "sanctions_counterparty"
    name: "Counterparty Sanctions Check"
    description: "Screen trading counterparties"
    rule_type: "SANCTIONS"
    enabled: true
    config:
      screen_type: "COUNTERPARTY"
      providers: ["ofac"]
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "REVIEW"
    severity: "HIGH"

  # Politically Exposed Persons (PEP)
  - id: "pep_user_onboarding"
    name: "PEP Screening on Onboarding"
    description: "Check if user is a Politically Exposed Person"
    rule_type: "PEP"
    enabled: true
    config:
      pep_list_provider: "chainalysis"
      enhanced_due_diligence: true
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 1
    action: "REVIEW"
    severity: "HIGH"

  # Unusual Pattern Detection (ML-based)
  - id: "unusual_trading_pattern"
    name: "Unusual Trading Pattern"
    description: "ML-based anomaly detection for trading behavior"
    rule_type: "UNUSUAL_PATTERN"
    enabled: false  # Requires ML model
    config:
      model: "isolation_forest"
      features:
        - "trade_frequency"
        - "order_size_distribution"
        - "time_of_day_pattern"
        - "market_preference"
        - "cancellation_rate"
      training_window_days: 30
      inference_window_hours: 1
      contamination: 0.01
    threshold_count: 0
    threshold_amount: "0"
    time_window_hours: 1
    action: "ALERT"
    severity: "MEDIUM"

  - id: "unusual_withdrawal_pattern"
    name: "Unusual Withdrawal Pattern"
    description: "Detect unusual withdrawal patterns (new address, large amount, odd time)"
    rule_type: "UNUSUAL_PATTERN"
    enabled: true
    config:
      checks:
        - "new_address"
        - "amount_deviation"
        - "time_deviation"
        - "velocity_spike"
      new_address_threshold_days: 30
      amount_deviation_multiplier: 5.0
      time_deviation_hours: 6
    threshold_count: 2
    threshold_amount: "0"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # Large Transaction Reporting
  - id: "large_transaction_report"
    name: "Large Transaction Reporting"
    description: "Flag transactions above regulatory reporting threshold"
    rule_type: "VELOCITY"
    enabled: true
    config:
      metric: "single_transaction_amount"
      threshold_usd: 10000
      auto_file_ctr: false  # Currency Transaction Report
    threshold_count: 1
    threshold_amount: "10000"
    time_window_hours: 1
    action: "ALERT"
    severity: "MEDIUM"

  # Dormant Account Activation
  - id: "dormant_account_activation"
    name: "Dormant Account Sudden Activity"
    description: "Detect sudden high activity from previously dormant accounts"
    rule_type: "UNUSUAL_PATTERN"
    enabled: true
    config:
      dormant_threshold_days: 90
      activity_spike_multiplier: 10.0
    threshold_count: 1
    threshold_amount: "0"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # Cross-Border Flow Monitoring
  - id: "cross_border_high_value"
    name: "High Value Cross-Border Flows"
    description: "Monitor high-value cross-border movements"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    config:
      threshold_usd: 50000
      monitor_corridors: true
    threshold_count: 1
    threshold_amount: "50000"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

# Rule Engine Configuration
engine:
  evaluation_interval_seconds: 60
  max_concurrent_evaluations: 100
  alert_retention_days: 90
  alert_escalation_hours: 24
  
  # Notification channels
  notifications:
    email:
      enabled: true
      recipients:
        - "compliance@encrypted-db.com"
    webhook:
      enabled: false
      url: ""
      secret: ""
    slack:
      enabled: false
      webhook_url: ""
      channel: "#compliance-alerts"